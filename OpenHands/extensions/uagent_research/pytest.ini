[pytest]
# Test discovery
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    asyncio: Async tests
    integration: Integration tests
    slow: Slow running tests

# Async support
asyncio_mode = auto

# Coverage
addopts =
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

[coverage:run]
source =
    control
    uagent_research.models
    orchestrator
    services

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.
    if TYPE_CHECKING:
    @abstractmethod
