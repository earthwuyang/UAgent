version: "3.9"

services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    environment:
      DEBUG: "1"
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${SANDBOX_RUNTIME_CONTAINER_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:latest}
      SANDBOX_VOLUMES: ${CODE_PATH:-$PWD}:/workspace:rw
      SANDBOX_USER_ID: ${UID:-1000}
      SANDBOX_USE_HOST_NETWORK: "true"
      DOCKER_HOST_ADDR: "127.0.0.1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Using host networking - extra_hosts and ports not needed
    network_mode: "host"
